<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen Shelf Cards</title></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style id="css">
:root{
  --bg:#F4F6F2; --paper:#FFFFFF; --ink:#1E2621; --muted:#5E6A62; --line:#D9DED6;
  --accent:#B7791F; --accent-ink:#FFFFFF; --accent-soft:#F6EBD6; --flag:#8A3B2E; --flag-soft:#F7E4DF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --paper:#1D2320; --ink:#E7ECE8; --muted:#9BA69F; --line:#323A35;
    --accent:#E0A94A; --accent-ink:#1D2320; --accent-soft:#3A2F1C; --flag:#E89A8B; --flag-soft:#3A2420;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141816; --paper:#1D2320; --ink:#E7ECE8; --muted:#9BA69F; --line:#323A35;
  --accent:#E0A94A; --accent-ink:#1D2320; --accent-soft:#3A2F1C; --flag:#E89A8B; --flag-soft:#3A2420;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
.intro{color:var(--muted);max-width:62ch;margin:6px 0 0}
.status{min-height:1.4em;margin:10px 0 0;font-weight:700;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}
.card::before{content:"";position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.num{font:600 .72rem/1 "Atkinson Hyperlegible",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.where{margin:0;font-size:.92rem;color:var(--muted)}
.where b{color:var(--ink)}
.loc{display:flex;flex-direction:column;gap:4px}
.loc label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.loc label+select,.loc label+input{margin-bottom:6px}
.loc input,.loc select,.add input{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--accent-soft);border:none;border-bottom:2px solid var(--accent);border-radius:3px 3px 0 0;padding:7px 9px}
.loc input:focus,.loc select:focus,.add input:focus{outline:2px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{padding:5px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
li:first-child{border-top:none}
.tags{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tag{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.tag.q{background:var(--flag-soft);color:var(--flag)}
.tag.d{background:var(--accent-soft);color:var(--accent)}
.sub{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:8px}
.rm{font:700 .95rem/1 "Atkinson Hyperlegible",sans-serif;min-width:28px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--muted);cursor:pointer}
.rm:hover{border-color:var(--flag);color:var(--flag)}
.rm.armed{background:var(--flag);border-color:var(--flag);color:var(--paper);font-size:.75rem}
.rm:focus-visible,.add button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{display:flex;gap:8px;align-items:stretch}
.add button{font:700 .9rem "Atkinson Hyperlegible",sans-serif;background:var(--accent);color:var(--accent-ink);border:none;border-radius:4px;padding:0 14px;cursor:pointer;white-space:nowrap}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.saving .grid{opacity:.55;pointer-events:none}
.notes{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.notes ul li{display:block}
.notes b{font-weight:700}
.notes .none{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--muted)}
.byarea{display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sech{margin:0;font:700 .95rem/1.2 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);padding-bottom:6px;border-bottom:2px solid var(--accent)}
.sech span{font:400 .8rem "Atkinson Hyperlegible",sans-serif;letter-spacing:0;text-transform:none;color:var(--muted)}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.ab{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ab p{margin:0;font-size:.92rem}
.ab p span{color:var(--muted)}
.map{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.map img{display:block;width:100%;height:auto;border-radius:3px}
.map figcaption{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.rm,.add button{transition:background .15s,color .15s,border-color .15s}}

.az{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.az input{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--accent-soft);border:none;border-bottom:2px solid var(--accent);border-radius:3px 3px 0 0;padding:10px 12px}
.az input:focus{outline:2px solid var(--accent);outline-offset:2px}
#azl{max-height:420px;overflow-y:auto;padding-right:4px}
#azl li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
#azl li.azl{display:block;position:sticky;top:0;background:var(--paper);font:700 .8rem "Bricolage Grotesque",sans-serif;letter-spacing:.12em;color:var(--accent);padding:8px 0 4px;border-top:none;border-bottom:2px solid var(--accent)}
#azl li[hidden]{display:none}
#azl .azi span{color:var(--muted);font-size:.92rem;text-align:right}
.azno{margin:0;color:var(--muted)}
</style>

<script id="code">
(function(){
var HEAD='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
var FONTS='<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">';
var AREAS=["Area 1","Area 2","Area 3","Area 4","Area 5","Area 6","Area 7","Outside kitchen","Not marked yet"];
var SECTIONS=[["Ground","left to right",["Area 1","Area 2","Area 3"]],["Countertop","",["Area 5"]],["Top","left to right",["Area 4","Area 6"]],["Area 7","",["Area 7"]],["Outside kitchen","",["Outside kitchen"]],["Not marked yet","",["Not marked yet"]]];
var READONLY_CODES=["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"];

function $(id){return document.getElementById(id);}
var state=JSON.parse($("state").textContent);
var IMG=JSON.parse($("img").textContent);
var art=null, readOnly=true, busy=false;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function all(c){return c.items.concat(c.items2||[]);}
function keyOf(it){return (it.k||it.t).toLowerCase().replace(/\([^)]*\)/g,"").replace(/\s+/g," ").trim().replace(/s$/,"");}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function rank(d){return /^top/i.test(d)?0:/^bottom/i.test(d)?1:2;}

function dupMap(){
  var m={};
  state.cards.forEach(function(c){all(c).forEach(function(it){var k=keyOf(it);(m[k]=m[k]||[]).push({n:c.n,t:it.t});});});
  return m;
}

function setStatus(msg){var el=$("status"); if(el) el.textContent=msg||"";}

function render(){
  var dm=dupMap();
  function li(c,it,col,i){
    var dup=dm[keyOf(it)].length>1;
    return '<li><span>'+esc(it.t)+'</span><span class="tags">'+
      (dup?'<span class="tag d">Also elsewhere</span>':'')+
      (it.q?'<span class="tag q">Check</span>':'')+
      (readOnly?'':'<button class="rm" type="button" data-card="'+c.n+'" data-col="'+col+'" data-i="'+i+'" aria-label="Remove '+esc(it.t)+'">\u00d7</button>')+
      '</span></li>';
  }
  function card(c){
    var loc = readOnly
      ? '<p class="where"><b>'+esc(c.area)+'</b>'+(c.loc?' \u00b7 '+esc(c.loc):'')+'</p>'
      : '<div class="loc"><label for="area'+c.n+'">Area</label><select id="area'+c.n+'" data-card="'+c.n+'" data-field="area">'+
          AREAS.map(function(a){return '<option'+(a===c.area?' selected':'')+'>'+a+'</option>';}).join('')+
        '</select><label for="loc'+c.n+'">Detail</label><input id="loc'+c.n+'" data-card="'+c.n+'" data-field="loc" value="'+esc(c.loc||"")+'" placeholder="e.g. Top shelf"></div>';
    var items=c.items.map(function(it,i){return li(c,it,"items",i);}).join('');
    var items2=(c.items2&&c.items2.length)?'<li class="sub">Right column</li>'+c.items2.map(function(it,i){return li(c,it,"items2",i);}).join(''):'';
    var add = readOnly?'':'<form class="add" data-card="'+c.n+'"><label class="vh" for="add'+c.n+'">Add an item to card '+c.n+'</label><input id="add'+c.n+'" placeholder="Add item" autocomplete="off"><button type="submit">Add</button></form>';
    return '<article class="card"><div><div class="num">Card '+c.n+'</div><h2>'+esc(c.title)+'</h2></div>'+loc+'<ul>'+items+items2+'</ul>'+add+'</article>';
  }
  var groups={};
  state.cards.forEach(function(c){(groups[c.area]=groups[c.area]||[]).push(c);});
  var byArea='<h2>By area</h2>'+SECTIONS.map(function(s){
    var has=s[2].filter(function(a){return groups[a];});
    if(!has.length) return '';
    return '<div class="sec"><h3 class="sech">'+s[0]+(s[1]?' <span>('+s[1]+')</span>':'')+'</h3><div class="ag">'+has.map(function(a){
      return '<div class="ab"><div class="num">'+esc(a)+'</div>'+groups[a].slice().sort(function(x,y){return rank(x.loc||"")-rank(y.loc||"");}).map(function(c){
        return '<p><b>'+esc(c.loc||"No detail")+'</b> \u00b7 Card '+c.n+'<br><span>'+all(c).map(function(it){return esc(it.t);}).join(', ')+'</span></p>';
      }).join('')+'</div>';
    }).join('')+'</div></div>';
  }).join('');


  var azmap={};
  state.cards.forEach(function(c){all(c).forEach(function(it){
    var k=keyOf(it); var e=azmap[k]=azmap[k]||{name:it.t,locs:[]};
    var loc=c.area+(c.loc?', '+c.loc:'');
    if(e.locs.indexOf(loc)<0) e.locs.push(loc);
  });});
  var azkeys=Object.keys(azmap).sort(function(a,b){return azmap[a].name.localeCompare(azmap[b].name);});
  var azhtml='', lastL='';
  azkeys.forEach(function(k){
    var e=azmap[k], L=e.name.charAt(0).toUpperCase();
    if(L!==lastL){azhtml+='<li class="azl" data-letter="'+esc(L)+'">'+esc(L)+'</li>';lastL=L;}
    azhtml+='<li class="azi" data-s="'+esc((e.name+' '+e.locs.join(' ')).toLowerCase())+'"><b>'+esc(e.name)+'</b><span>'+e.locs.map(esc).join(' &middot; ')+'</span></li>';
  });
  var azsec='<section class="az"><h2>Find an item</h2><label class="vh" for="azq">Search items</label><input id="azq" type="search" placeholder="Type an item, e.g. dry chilli" autocomplete="off"><ul id="azl">'+azhtml+'</ul><p class="azno" id="azno" hidden>Nothing found. Try another spelling.</p></section>';

  var dups=Object.keys(dm).filter(function(k){return dm[k].length>1;}).map(function(k){
    var occ=dm[k], ns=occ.map(function(o){return o.n;});
    var uniq=ns.filter(function(n,i){return ns.indexOf(n)===i;});
    var name=cap(k);
    var where = uniq.length===1 ? 'twice on card '+uniq[0] : 'cards '+uniq.join(', ');
    return {name:name,html:'<li><b>'+esc(name)+'</b>: '+where+'</li>'};
  }).sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(d){return d.html;}).join('');
  var checks=[];
  state.cards.forEach(function(c){all(c).forEach(function(it){if(it.q) checks.push('<li><b>'+esc(it.t)+'</b> (card '+c.n+'): '+esc(it.q)+'</li>');});});

  $("app").innerHTML=
    '<header><h1>Kitchen Shelf Cards</h1><p class="intro">Every shelf card in the kitchen, grouped by the numbered areas in the photo. '+
    (readOnly?'':'Add items with the box at the bottom of a card and remove them with \u00d7. Changes save to this page right away.')+
    '</p><p class="status" id="status" role="status" aria-live="polite"></p></header>'+
    '<figure class="map"><img src="'+IMG+'" alt="Kitchen with storage areas numbered 1 to 6"><figcaption>Areas 1\u20136. Card 7 is kept outside the kitchen. Area 7 is not in the photo.</figcaption></figure>'+
    azsec+'<section class="byarea">'+byArea+'</section>'+
    '<div class="legend"><span><span class="tag d">Also elsewhere</span> item is on more than one card</span><span><span class="tag q">Check</span> not sure what this is</span></div>'+
    '<section class="grid">'+state.cards.map(card).join('')+'</section>'+
    '<section class="notes"><div><h2>Items in more than one place</h2><ul>'+(dups||'<li class="none">None</li>')+'</ul></div>'+
    '<div><h2>To check</h2><ul>'+(checks.join('')||'<li class="none">Nothing to check</li>')+'</ul></div></section>';
}

function buildDoc(s){
  return HEAD+'<title>Kitchen Shelf Cards</title>\n'+FONTS+'\n<style id="css">'+$("css").textContent+'</style>\n<div class="wrap" id="app"></div>\n'+
    '<script type="application/json" id="img">'+$("img").textContent+'<\/script>\n'+
    '<script type="application/json" id="state">'+JSON.stringify(s).replace(/</g,"\\u003c")+'<\/script>\n'+
    '<script id="code">'+$("code").textContent+'<\/script></body></html>';
}

function save(mutate,flash){
  if(busy||readOnly||!art) return;
  var next=JSON.parse(JSON.stringify(state));
  mutate(next);
  busy=true; $("app").classList.add("saving"); setStatus("Saving\u2026");
  try{sessionStorage.setItem("kitchenFlash",flash);}catch(e){}
  art.publish(buildDoc(next)).then(function(){
    state=next; setStatus(flash);
  },function(e){
    busy=false; $("app").classList.remove("saving");
    try{sessionStorage.removeItem("kitchenFlash");}catch(_){}
    var code=e&&e.code;
    if(code==="conflict"){setStatus("Someone else saved a change first. Loading the latest version\u2026");return;}
    if(READONLY_CODES.indexOf(code)>-1){readOnly=true;render();setStatus("This page is view-only for you, so changes can't be saved.");return;}
    if(code==="rate_limited"){setStatus("Too many saves in a row. Wait a moment, then try again.");return;}
    setStatus("Couldn't save just now. Check your connection and try again.");
  });
}
function cardOf(s,n){for(var i=0;i<s.cards.length;i++){if(s.cards[i].n===n) return s.cards[i];}return null;}

document.addEventListener("click",function(ev){
  var b=ev.target.closest&&ev.target.closest(".rm");
  if(!b||readOnly||busy) return;
  if(!b.classList.contains("armed")){
    document.querySelectorAll(".rm.armed").forEach(function(x){x.classList.remove("armed");x.textContent="\u00d7";});
    b.classList.add("armed"); b.textContent="Remove";
    setTimeout(function(){if(b.isConnected&&!busy){b.classList.remove("armed");b.textContent="\u00d7";}},4000);
    return;
  }
  var n=+b.dataset.card, col=b.dataset.col, i=+b.dataset.i;
  var c=cardOf(state,n), it=c&&c[col]&&c[col][i];
  if(!it) return;
  save(function(s){cardOf(s,n)[col].splice(i,1);},'Removed "'+it.t+'" from card '+n+'.');
});

document.addEventListener("submit",function(ev){
  var f=ev.target.closest&&ev.target.closest("form.add");
  if(!f) return;
  ev.preventDefault();
  if(readOnly||busy) return;
  var n=+f.dataset.card, inp=f.querySelector("input");
  var names=inp.value.split(",").map(function(x){return x.trim();}).filter(Boolean).map(cap);
  if(!names.length){setStatus("Type an item name first.");inp.focus();return;}
  save(function(s){var c=cardOf(s,n);names.forEach(function(t){c.items.push({t:t});});},
    'Added '+names.map(function(t){return '"'+t+'"';}).join(', ')+' to card '+n+'.');
});

document.addEventListener("change",function(ev){
  var el=ev.target;
  if(!el.dataset||!el.dataset.field||readOnly||busy) return;
  var n=+el.dataset.card, field=el.dataset.field, val=el.value.trim();
  var c=cardOf(state,n);
  if(!c||c[field]===val) return;
  save(function(s){cardOf(s,n)[field]=val;},'Card '+n+' is now in '+(field==="area"?val:(c.area+', '+(val||"no detail")))+'.');
});

document.addEventListener("input",function(ev){
  var el=ev.target;
  if(!el||el.id!=="azq") return;
  var q=el.value.trim().toLowerCase(), list=$("azl"), any=false, pendingLetter=null, kids=list.children;
  for(var i=0;i<kids.length;i++){
    var li=kids[i];
    if(li.classList.contains("azl")){li.hidden=true;pendingLetter=li;continue;}
    var show=!q||li.getAttribute("data-s").indexOf(q)>-1;
    li.hidden=!show;
    if(show){any=true;if(pendingLetter)pendingLetter.hidden=false;}
  }
  $("azno").hidden=any;
});

render();
try{var fl=sessionStorage.getItem("kitchenFlash");if(fl){setStatus(fl);sessionStorage.removeItem("kitchenFlash");}}catch(e){}

if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(a){
    if(!a) return;
    art=a;
    var u=window.claude.use("user");
    return Promise.resolve(u).then(function(user){
      if(!user) return true;
      return user.canEdit().catch(function(){return true;});
    },function(){return true;}).then(function(can){
      if(can===false) return;
      readOnly=false;
      var msg=$("status")?$("status").textContent:"";
      render(); setStatus(msg);
    });
  }).catch(function(){});
}
})();
</script>
